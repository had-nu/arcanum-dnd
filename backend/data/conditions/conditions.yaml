id: srd5.2-conditions
name: "SRD 5.2 Conditions"
version: "1.0.0"
license: OGL
attribution: "Wizards of the Coast — Player's Handbook (2024)"

conditions:
  - id: blinded
    name: Blinded
    effects:
      - kind: RollDisadvantage
        targetCheck: ability
      - kind: RollAdvantage
        targetCheck: ability
      - kind: Custom
        handlerId: condition.blinded.fail-sight-checks

  - id: charmed
    name: Charmed
    effects:
      - kind: RollDisadvantage
        targetCheck: ability
      - kind: Custom
        handlerId: condition.charmed.cannot-attack-charmer

  - id: deafened
    name: Deafened
    effects:
      - kind: Custom
        handlerId: condition.deafened.fail-hearing-checks

  - id: exhaustion
    name: Exhaustion
    effects:
      - kind: Custom
        handlerId: condition.exhaustion.level-effects

  - id: frightened
    name: Frightened
    effects:
      - kind: RollDisadvantage
        targetCheck: ability
      - kind: Custom
        handlerId: condition.frightened.cannot-approach

  - id: grappled
    name: Grappled
    effects:
      - kind: SetSpeed
        value: 0
      - kind: Custom
        handlerId: condition.grappled.can-be-moved

  - id: incapacitated
    name: Incapacitated
    effects:
      - kind: Custom
        handlerId: condition.incapacitated.no-actions
      - kind: Custom
        handlerId: condition.incapacitated.no-reactions

  - id: invisible
    name: Invisible
    effects:
      - kind: RollAdvantage
        targetAttack: true
      - kind: Custom
        handlerId: condition.invisible.cannot-be-seen

  - id: paralyzed
    name: Paralyzed
    effects:
      - kind: Custom
        handlerId: condition.paralyzed.no-actions
      - kind: RollDisadvantage
        targetSave: DEX
      - kind: RollAdvantage
        targetAttack: true

  - id: petrified
    name: Petrified
    effects:
      - kind: Custom
        handlerId: condition.petrified.transformed-to-stone
      - kind: Resistance
        damageType: bludgeoning
      - kind: Resistance
        damageType: slashing
      - kind: Resistance
        damageType: piercing

  - id: poisoned
    name: Poisoned
    effects:
      - kind: RollDisadvantage
        targetCheck: ability

  - id: prone
    name: Prone
    effects:
      - kind: RollDisadvantage
        targetAttack: true
      - kind: RollAdvantage
        targetAttack: true

  - id: restrained
    name: Restrained
    effects:
      - kind: SetSpeed
        value: 0
      - kind: RollDisadvantage
        targetAttack: true
      - kind: RollAdvantage
        targetAttack: true

  - id: stunned
    name: Stunned
    effects:
      - kind: Custom
        handlerId: condition.stunned.no-actions
      - kind: Custom
        handlerId: condition.stunned.no-movement
      - kind: RollDisadvantage
        targetSave: STR
      - kind: RollAdvantage
        targetAttack: true

  - id: unconscious
    name: Unconscious
    effects:
      - kind: Custom
        handlerId: condition.unconscious.prone
      - kind: Custom
        handlerId: condition.unconscious.no-actions
      - kind: RollDisadvantage
        targetSave: DEX
      - kind: Custom
        handlerId: condition.unconscious.crit-hits
