server:
  addr: ":8080"
  read_timeout: 10s
  write_timeout: 30s
  shutdown_grace: 15s

cors:
  allowed_origins:
    - "http://localhost:5173"
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allowed_headers:
    - "Content-Type"
    - "Authorization"

data:
  content_dir: "./data"
  characters_dir: "./var/characters"
  sqlite_path: "./var/arcanum.db"

log:
  level: "info"
  format: "text"