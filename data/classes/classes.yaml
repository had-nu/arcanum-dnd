  # ── Paladin ───────────────────────────────────────
  - id: paladin
    name: Paladin
    hitDie: d10
    primaryAbility: [STR, CHA]
    savingThrows: [WIS, CHA]
    spellcasting:
      type: half
      ability: CHA
    proficiencies:
      armor: [light, medium, heavy, shield]
      weapons: [simple, martial]
      skills:
        - skill: persuasion
          choose: 2
          from: [athletics, insight, intimidation, medicine, persuasion, religion]
    subClasses:
      - id: oath-of-devotion
        name: Oath of Devotion
        description: A paladin sworn to the ideals of justice, virtue, and honor.
      - id: oath-of-glory
        name: Oath of Glory
        description: A paladin who seeks heroic deeds and inspires greatness in others.
      - id: oath-of-the-ancients
        name: Oath of the Ancients
        description: A paladin who guards the light of life and the beauty of the natural world.
      - id: oath-of-vengeance
        name: Oath of Vengeance
        description: A paladin who hunts and destroys evil with relentless determination.
    levels:
      - { level: 1, profBonus: 2, features: [class.paladin.lay-on-hands, class.paladin.weapon-mastery] }
      - { level: 2, profBonus: 2, features: [class.paladin.fighting-style, class.paladin.spellcasting], preparedSpells: 2, spellSlots: {1: 2} }
