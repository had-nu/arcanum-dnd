  # ── Fighter ───────────────────────────────────────
  - id: fighter
    name: Fighter
    hitDie: d10
    primaryAbility: [STR, DEX]
    savingThrows: [STR, CON]
    proficiencies:
      armor: [light, medium, heavy, shield]
      weapons: [simple, martial]
      skills:
        - skill: athletics
          choose: 2
          from: [acrobatics, animal-handling, athletics, history, insight, intimidation, perception, survival]
    subClasses:
      - id: battle-master
        name: Battle Master
        description: A fighter who masters specialized combat maneuvers for tactical superiority.
      - id: champion
        name: Champion
        description: A fighter who relies on raw physical prowess and superior athleticism.
      - id: eldritch-knight
        name: Eldritch Knight
        description: A fighter who blends martial combat with abjuration and evocation magic.
        spellcastingOverride:
          type: third
          ability: INT
      - id: psi-warrior
        name: Psi Warrior
        description: A fighter who harnesses psionic power to enhance combat and protect allies.
    levels:
      - { level: 1, profBonus: 2, features: [class.fighter.fighting-style, class.fighter.second-wind] }
      - { level: 2, profBonus: 2, features: [class.fighter.action-surge] }
      - { level: 3, profBonus: 2, features: [class.fighter.subclass] }
      - { level: 4, profBonus: 2, feat: ability-score-improvement }
      - { level: 5, profBonus: 3, features: [class.fighter.extra-attack] }
      - { level: 6, profBonus: 3, feat: ability-score-improvement }
      - { level: 7, profBonus: 3, features: [class.fighter.subclass-feature] }
      - { level: 8, profBonus: 3, feat: ability-score-improvement }
      - { level: 9, profBonus: 4, features: [class.fighter.indomitable] }
      - { level: 10, profBonus: 4, features: [class.fighter.subclass-feature] }
      - { level: 11, profBonus: 4, features: [class.fighter.extra-attack-2] }
      - { level: 12, profBonus: 4, feat: ability-score-improvement }
      - { level: 13, profBonus: 5, features: [class.fighter.indomitable-improved] }
      - { level: 14, profBonus: 5, feat: ability-score-improvement }
      - { level: 15, profBonus: 5, features: [class.fighter.subclass-feature] }
      - { level: 16, profBonus: 5, feat: ability-score-improvement }
      - { level: 17, profBonus: 6, features: [class.fighter.action-surge-2, class.fighter.indomitable-improved] }
      - { level: 18, profBonus: 6, features: [class.fighter.subclass-feature] }
      - { level: 19, profBonus: 6, feat: ability-score-improvement }
      - { level: 20, profBonus: 6, features: [class.fighter.extra-attack-3] }

  # ── Monk ──────────────────────────────────────────
  - id: monk
    name: Monk
    hitDie: d8
    primaryAbility: [DEX, WIS]
    savingThrows: [STR, DEX]
    proficiencies:
