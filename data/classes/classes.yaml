        description: A druid attuned to a specific natural terrain, drawing power from the land.
      - id: circle-of-the-moon
        name: Circle of the Moon
        description: A druid who masters the primal art of shapeshifting into powerful beasts.
      - id: circle-of-the-sea
        name: Circle of the Sea
        description: A druid who draws power from the ocean's tides and storms.
    levels:
      - { level: 1, profBonus: 2, features: [class.druid.spellcasting, class.druid.wild-shape], cantripsKnown: 2, preparedSpells: 4, spellSlots: {1: 2} }
      - { level: 2, profBonus: 2, features: [class.druid.wild-shape-improved], spellSlots: {1: 3}, cantripsKnown: 2, preparedSpells: 5 }
