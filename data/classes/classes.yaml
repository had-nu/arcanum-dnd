      - { level: 7, profBonus: 3, features: [class.druid.wild-shape-improved], spellSlots: {1: 4, 2: 3, 3: 3, 4: 1}, cantripsKnown: 3, preparedSpells: 11 }
      - { level: 8, profBonus: 3, feat: ability-score-improvement, spellSlots: {1: 4, 2: 3, 3: 3, 4: 2}, cantripsKnown: 3, preparedSpells: 12 }
      - { level: 9, profBonus: 4, features: [class.druid.wild-shape-improved], spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 1}, cantripsKnown: 3, preparedSpells: 14 }
      - { level: 10, profBonus: 4, features: [class.druid.subclass-feature], spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 2}, cantripsKnown: 4, preparedSpells: 15 }
      - { level: 11, profBonus: 4, features: [class.druid.wild-shape-improved], spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 3}, cantripsKnown: 4, preparedSpells: 16 }
      - { level: 12, profBonus: 4, feat: ability-score-improvement, spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 3}, cantripsKnown: 4, preparedSpells: 16 }
      - { level: 13, profBonus: 5, features: [class.druid.wild-shape-improved], spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 3, 6: 1}, cantripsKnown: 4, preparedSpells: 17 }
      - { level: 14, profBonus: 5, features: [class.druid.subclass-feature], spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 3, 6: 1}, cantripsKnown: 4, preparedSpells: 17 }
      - { level: 15, profBonus: 5, features: [class.druid.wild-shape-improved], spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 3, 6: 1, 7: 1}, cantripsKnown: 4, preparedSpells: 18 }
      - { level: 16, profBonus: 5, feat: ability-score-improvement, spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 3, 6: 1, 7: 1}, cantripsKnown: 4, preparedSpells: 18 }
