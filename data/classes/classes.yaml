id: srd5.2-classes
name: "SRD 5.2 Classes"
version: "1.0.0"
license: OGL
attribution: "Wizards of the Coast — Player's Handbook (2024)"

classes:
  # ── Barbarian ─────────────────────────────────────
  - id: barbarian
    name: Barbarian
    hitDie: d12
    primaryAbility: [STR]
    savingThrows: [STR, CON]
    proficiencies:
      armor: [light, medium, shield]
      weapons: [simple, martial]
      skills:
        - skill: animal-handling
          choose: 2
          from: [animal-handling, athletics, intimidation, nature, perception, survival]
    subClasses:
      - id: berserker
        name: Berserker
        description: A primal warrior whose rage unlocks ferocious strength and resilience.
      - id: wild-heart
        name: Wild Heart
        description: A barbarian who draws power from a spiritual bond with the natural world.
      - id: world-tree
        name: World Tree
        description: A barbarian whose rage channels the cosmic energy of the World Tree.
    levels:
      - { level: 1, profBonus: 2, features: [class.barbarian.rage, class.barbarian.unarmored-defense] }
      - { level: 2, profBonus: 2, features: [class.barbarian.danger-sense, class.barbarian.reckless-attack] }
      - { level: 3, profBonus: 2, features: [class.barbarian.primal-knowledge, class.barbarian.subclass] }
      - { level: 4, profBonus: 2, feat: ability-score-improvement }
      - { level: 5, profBonus: 3, features: [class.barbarian.extra-attack, class.barbarian.fast-movement] }
      - { level: 6, profBonus: 3, features: [class.barbarian.subclass-feature] }
      - { level: 7, profBonus: 3, features: [class.barbarian.feral-instinct] }
      - { level: 8, profBonus: 3, feat: ability-score-improvement }
      - { level: 9, profBonus: 4, features: [class.barbarian.brutal-strike] }
      - { level: 10, profBonus: 4, features: [class.barbarian.subclass-feature] }
      - { level: 11, profBonus: 4, features: [class.barbarian.relentless-rage] }
      - { level: 12, profBonus: 4, feat: ability-score-improvement }
      - { level: 13, profBonus: 5, features: [class.barbarian.improved-brutal-strike] }
      - { level: 14, profBonus: 5, features: [class.barbarian.subclass-feature] }
      - { level: 15, profBonus: 5, features: [class.barbarian.persistent-rage] }
      - { level: 16, profBonus: 5, feat: ability-score-improvement }
      - { level: 17, profBonus: 6, features: [class.barbarian.improved-brutal-strike] }
      - { level: 18, profBonus: 6, features: [class.barbarian.indomitable-might] }
      - { level: 19, profBonus: 6, feat: ability-score-improvement }
      - { level: 20, profBonus: 6, features: [class.barbarian.primal-champion] }

  # ── Bard ──────────────────────────────────────────
  - id: bard
    name: Bard
    hitDie: d8
    primaryAbility: [CHA]
    savingThrows: [DEX, CHA]
    spellcasting:
      type: full
      ability: CHA
    proficiencies:
      armor: [light]
      weapons: [simple]
      skills:
        - skill: performance
          choose: 3
          from: [acrobatics, animal-handling, arcana, athletics, deception, history, insight, intimidation, investigation, medicine, nature, perception, performance, persuasion, religion, sleight-of-hand, stealth, survival]
    subClasses:
      - id: college-of-dance
        name: College of Dance
        description: A bard who channels magic through graceful movement and performance.
      - id: college-of-glamour
        name: College of Glamour
        description: A bard who weaves enchantments with fey-touched charm and beauty.
      - id: college-of-valor
        name: College of Valor
        description: A bard who inspires courage on the battlefield with daring deeds.
    levels:
      - { level: 1, profBonus: 2, features: [class.bard.spellcasting, class.bard.bardic-inspiration], cantripsKnown: 2, spellsKnown: 4, spellSlots: {1: 2} }
      - { level: 2, profBonus: 2, features: [class.bard.jack-of-all-trades, class.bard.expertise], spellSlots: {1: 3}, cantripsKnown: 2, spellsKnown: 5 }
      - { level: 3, profBonus: 2, features: [class.bard.subclass], spellSlots: {1: 4, 2: 2}, cantripsKnown: 2, spellsKnown: 6 }
      - { level: 4, profBonus: 2, feat: ability-score-improvement, spellSlots: {1: 4, 2: 3}, cantripsKnown: 3, spellsKnown: 7 }
      - { level: 5, profBonus: 3, features: [class.bard.font-of-inspiration], spellSlots: {1: 4, 2: 3, 3: 2}, cantripsKnown: 3, spellsKnown: 9 }
      - { level: 6, profBonus: 3, features: [class.bard.subclass-feature, class.bard.countercharm], spellSlots: {1: 4, 2: 3, 3: 3}, cantripsKnown: 3, spellsKnown: 10 }
      - { level: 7, profBonus: 3, features: [class.bard.expertise], spellSlots: {1: 4, 2: 3, 3: 3, 4: 1}, cantripsKnown: 3, spellsKnown: 11 }
      - { level: 8, profBonus: 3, feat: ability-score-improvement, spellSlots: {1: 4, 2: 3, 3: 3, 4: 2}, cantripsKnown: 3, spellsKnown: 12 }
      - { level: 9, profBonus: 4, features: [class.bard.song-of-rest], spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 1}, cantripsKnown: 3, spellsKnown: 14 }
      - { level: 10, profBonus: 4, features: [class.bard.subclass-feature, class.bard.magical-secrets], spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 2}, cantripsKnown: 4, spellsKnown: 15 }
      - { level: 11, profBonus: 4, features: [class.bard.font-of-inspiration], spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 3}, cantripsKnown: 4, spellsKnown: 16 }
      - { level: 12, profBonus: 4, feat: ability-score-improvement, spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 3}, cantripsKnown: 4, spellsKnown: 16 }
      - { level: 13, profBonus: 5, features: [class.bard.song-of-rest], spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 3, 6: 1}, cantripsKnown: 4, spellsKnown: 17 }
      - { level: 14, profBonus: 5, features: [class.bard.subclass-feature, class.bard.magical-secrets], spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 3, 6: 1}, cantripsKnown: 4, spellsKnown: 17 }
      - { level: 15, profBonus: 5, features: [class.bard.font-of-inspiration], spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 3, 6: 1, 7: 1}, cantripsKnown: 4, spellsKnown: 18 }
      - { level: 16, profBonus: 5, feat: ability-score-improvement, spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 3, 6: 1, 7: 1}, cantripsKnown: 4, spellsKnown: 18 }
      - { level: 17, profBonus: 6, features: [class.bard.song-of-rest], spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 3, 6: 1, 7: 1, 8: 1}, cantripsKnown: 4, spellsKnown: 19 }
      - { level: 18, profBonus: 6, features: [class.bard.magical-secrets], spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 3, 6: 1, 7: 1, 8: 1, 9: 1}, cantripsKnown: 4, spellsKnown: 20 }
      - { level: 19, profBonus: 6, feat: ability-score-improvement, spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 3, 6: 1, 7: 1, 8: 1, 9: 1}, cantripsKnown: 4, spellsKnown: 20 }
      - { level: 20, profBonus: 6, features: [class.bard.superior-inspiration], spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 3, 6: 1, 7: 1, 8: 1, 9: 1}, cantripsKnown: 4, spellsKnown: 22 }

  # ── Cleric ────────────────────────────────────────
  - id: cleric
    name: Cleric
    hitDie: d8
    primaryAbility: [WIS]
    savingThrows: [WIS, CHA]
    spellcasting:
      type: full
      ability: WIS
    proficiencies:
      armor: [light, medium, shield]
      weapons: [simple]
      skills:
        - skill: religion
          choose: 2
          from: [history, insight, medicine, persuasion, religion]
    subClasses:
      - id: life-domain
        name: Life Domain
        description: A cleric devoted to the positive forces of life, healing, and renewal.
      - id: light-domain
        name: Light Domain
        description: A cleric who channels radiant fire to burn away darkness and evil.
      - id: trickery-domain
        name: Trickery Domain
        description: A cleric who serves gods of mischief, deception, and illusion.
      - id: war-domain
        name: War Domain
        description: A cleric blessed with martial prowess and divine fury in battle.
    levels:
      - { level: 1, profBonus: 2, features: [class.cleric.spellcasting, class.cleric.divine-order], cantripsKnown: 3, preparedSpells: 4, spellSlots: {1: 2} }
      - { level: 2, profBonus: 2, features: [class.cleric.turn-undead, class.cleric.channel-divinity], spellSlots: {1: 3}, cantripsKnown: 3, preparedSpells: 5 }
      - { level: 3, profBonus: 2, features: [class.cleric.subclass], spellSlots: {1: 4, 2: 2}, cantripsKnown: 3, preparedSpells: 6 }
      - { level: 4, profBonus: 2, feat: ability-score-improvement, spellSlots: {1: 4, 2: 3}, cantripsKnown: 3, preparedSpells: 7 }
      - { level: 5, profBonus: 3, features: [class.cleric.destroy-undead], spellSlots: {1: 4, 2: 3, 3: 2}, cantripsKnown: 3, preparedSpells: 9 }
      - { level: 6, profBonus: 3, features: [class.cleric.subclass-feature], spellSlots: {1: 4, 2: 3, 3: 3}, cantripsKnown: 3, preparedSpells: 10 }
      - { level: 7, profBonus: 3, features: [class.cleric.destroy-undead], spellSlots: {1: 4, 2: 3, 3: 3, 4: 1}, cantripsKnown: 3, preparedSpells: 11 }
      - { level: 8, profBonus: 3, feat: ability-score-improvement, spellSlots: {1: 4, 2: 3, 3: 3, 4: 2}, cantripsKnown: 3, preparedSpells: 12 }
      - { level: 9, profBonus: 4, features: [class.cleric.destroy-undead], spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 1}, cantripsKnown: 3, preparedSpells: 14 }
      - { level: 10, profBonus: 4, features: [class.cleric.divine-intervention], spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 2}, cantripsKnown: 4, preparedSpells: 15 }
      - { level: 11, profBonus: 4, features: [class.cleric.destroy-undead], spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 3}, cantripsKnown: 4, preparedSpells: 16 }
      - { level: 12, profBonus: 4, feat: ability-score-improvement, spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 3}, cantripsKnown: 4, preparedSpells: 16 }
      - { level: 13, profBonus: 5, features: [class.cleric.destroy-undead], spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 3, 6: 1}, cantripsKnown: 4, preparedSpells: 17 }
      - { level: 14, profBonus: 5, features: [class.cleric.subclass-feature], spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 3, 6: 1}, cantripsKnown: 4, preparedSpells: 17 }
      - { level: 15, profBonus: 5, features: [class.cleric.destroy-undead], spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 3, 6: 1, 7: 1}, cantripsKnown: 4, preparedSpells: 18 }
      - { level: 16, profBonus: 5, feat: ability-score-improvement, spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 3, 6: 1, 7: 1}, cantripsKnown: 4, preparedSpells: 18 }
      - { level: 17, profBonus: 6, features: [class.cleric.destroy-undead], spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 3, 6: 1, 7: 1, 8: 1}, cantripsKnown: 4, preparedSpells: 19 }
      - { level: 18, profBonus: 6, features: [class.cleric.subclass-feature], spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 3, 6: 1, 7: 1, 8: 1, 9: 1}, cantripsKnown: 4, preparedSpells: 20 }
      - { level: 19, profBonus: 6, feat: ability-score-improvement, spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 3, 6: 1, 7: 1, 8: 1, 9: 1}, cantripsKnown: 4, preparedSpells: 20 }
      - { level: 20, profBonus: 6, features: [class.cleric.divine-intervention-improved], spellSlots: {1: 4, 2: 3, 3: 3, 4: 3, 5: 3, 6: 1, 7: 1, 8: 1, 9: 1}, cantripsKnown: 4, preparedSpells: 22 }

  # ── Druid ─────────────────────────────────────────
  - id: druid
    name: Druid
    hitDie: d8
    primaryAbility: [WIS]
    savingThrows: [INT, WIS]
    spellcasting:
      type: full
      ability: WIS
    proficiencies:
